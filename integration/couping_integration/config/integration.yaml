# Couping 연동 설정 (오케스트레이터 · OMX packer). 두산 피킹·비전 설정은 couping/config/couping.yaml

/**/omx_packer:
  ros__parameters:
    # 양팔 OMX (OMX 팀 omx/scripts/run_act.sh). 비운 값은 run_act.sh 기본값을 씀
    run_script: ~/team/kernel-robot-repo-1/omx/scripts/run_act.sh
    policy_path: ~/omx_models/act_120000/pretrained_model   # omx/models/README.md 의 릴리스 모델(120000 스텝)을 풀어 둔 곳
    left_cam: ''                # 예: /dev/video4  (lerobot-find-cameras opencv 로 확인, RealSense 번호와 겹치지 않게)
    right_cam: ''
    head_cam: ''
    task: Packaging the box     # 학습 때 문장과 같게
    policy_device: cpu          # 추론 장치. GPU(NVIDIA) 노트북이면 cuda, 없으면 cpu (100걸음마다 약 0.6초 멈춤)
    episode_time: 60
    ports: [/dev/left_omx_follower, /dev/right_omx_follower]   # signal_only 때 확인
    fake_seconds: 5.0           # fake:=true 일 때 OMX 대신 기다리는 시간

/**/orchestrator:
  ros__parameters:
    enable_picker: true
    enable_pinky: true
    enable_packer: true
    return_home: true
    picker_timeout: 120.0       # 품목 하나당 (주문 품목 수만큼 곱함)
    nav_timeout: 120.0
    packer_timeout: 120.0       # episode_time(60) + 카메라·모델 로딩 여유
    manual_transfer: false      # 핑키 없이: 피킹 뒤 사람이 박스를 OMX 로 옮기고 관리자 화면 '박스 옮김 완료'
    transfer_timeout: 600.0
    nav_action: /navigate_to_pose
    map_frame: map
    # arena_map 좌표 [x(m), y(m), yaw(rad)]. Gazebo 디지털 트윈 배치(진열대·OMX) 앞 빈 곳에서 정하고,
    # arena_map 에서 벽·장애물과 13cm 이상 떨어지게 맞춘 값. yaw 는 진열대·OMX 를 바라보는 방향.
    # TODO: 실제 핑키로 RViz 2D Goal Pose 확인 후 수정
    # 피킹 구역. 주문에 든 품목의 구역을 이 순서대로 들르고, 구역마다 도착하면 두산이 그 구역 품목을 집음
    pick_zones: [daily, food]
    daily:                      # 생활용품
      items: [tide, paper_towel, bath_tissue]
      pose: [0.13, 1.45, -3.14] # Gazebo 오른쪽 위 진열대(shelf_a 2개) 앞
    food:                       # 식품
      items: [tomato, carrot, salad]
      pose: [1.13, 1.01, -1.57] # Gazebo 가운데 아래 진열대(shelf_b) 옆
    pack_pose: [0.97, 0.23, 0.0]  # OMX 앞 정차 위치 (Gazebo 왼쪽 아래 OMX 2대 앞)
    home_pose: [0.17, 0.01, 1.57] # 핑키 대기 위치 (Gazebo 왼쪽 위 방). 주문 끝나면 복귀

/**/fake_pinky:
  ros__parameters:
    # fake_pinky:=true 일 때만 쓰는 가짜 핑키 (실제 핑키 없이 시험)
    start_pose: [0.17, 0.01, 1.57] # home_pose 와 같게
    speed: 0.2                  # m/s, 이동 시간 = 거리 / speed
