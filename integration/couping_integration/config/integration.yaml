# Couping 연동 설정 (오케스트레이터 · OMX packer). 두산 피킹·비전 설정은 couping/config/couping.yaml

/**/omx_packer:
  ros__parameters:
    # 양팔 OMX (OMX 팀 omx/scripts/run_act.sh). 비운 값은 run_act.sh 기본값을 씀
    run_script: ~/team/kernel-robot-repo-1/omx/scripts/run_act.sh
    policy_path: ~/team/kernel-robot-repo-1/omx/models/act_120000/pretrained_model   # 릴리스 omx-act-120000 (git 에는 안 올라감)
    # 카메라는 /dev/videoN 대신 꽂힌 USB 자리 기준 경로 (다시 꽂아도 번호가 안 바뀜, 같은 자리에 꽂을 것)
    # 10/27 다시 꽂아 확인: 왼손목 = 10.4, 오른손목 = 10.3, 머리(SNAP U2) = 3 (본체 포트)
    left_cam: /dev/v4l/by-path/pci-0000:80:14.0-usb-0:10.4:1.0-video-index0
    right_cam: /dev/v4l/by-path/pci-0000:80:14.0-usb-0:10.3:1.0-video-index0
    head_cam: /dev/v4l/by-path/pci-0000:80:14.0-usb-0:3:1.0-video-index0
    cam_fourcc: MJPG            # 이 노트북은 카메라 3대가 USB 2 허브 하나에 있어 압축(MJPG)해야 영상이 나옴
    task: Packaging the box     # 학습 때 문장과 같게
    episode_time: 60
    ports: [/dev/left_omx_follower, /dev/right_omx_follower]   # signal_only 때 확인
    fake_seconds: 5.0           # fake:=true 일 때 OMX 대신 기다리는 시간

/**/orchestrator:
  ros__parameters:
    enable_picker: true
    enable_pinky: true
    enable_packer: true
    return_home: false          # 포장 구역까지 간 뒤 home_pose(주차 구역)로 복귀할지
    picker_timeout: 600.0       # 품목 하나당 (주문 품목 수만큼 곱함). 카메라 확인 후 재시도(최대 3번, 한 번 약 65초) 포함
    nav_timeout: 120.0
    packer_timeout: 120.0       # episode_time(60) + 카메라·모델 로딩 여유
    pause_on_error: false       # false: 실패한 주문은 실패로 남기고 다음 주문을 바로 진행 (true: 멈추고 resume 대기)
    manual_transfer: false      # 핑키 없이: 피킹 뒤 사람이 박스를 OMX 로 옮기고 관리자 화면 '박스 옮김 완료'
    transfer_timeout: 600.0
    nav_action: /navigate_to_pose
    map_frame: map
    # 정밀 도킹 (amr/pinky_precision_docking). false 면 Nav2 좌표까지만 가고 도킹·후진은 안 함
    docking: true
    dock_timeout: 120.0
    undock_speed: 0.05          # 후진 속도 (m/s)
    # 지도 좌표 [x(m), y(m), yaw(rad)] = 도킹 진입 좌표 (팀 run_arena_mission.py WAYPOINTS 와 같은 값)
    # 창고 구역: 주문 품목이 있는 구역만 차례로 들름. 구역별 품목은 *_items
    zone_a_marker: 7                     # 선반 1번(아라비아 숫자 8·9·7) 중 7번
    zone_a_pose: [0.600, 1.470, 3.1416]
    zone_a_undock: 0.55                  # 작업 뒤 후진 거리 (m)
    zone_a_items: [bath_tissue, tide, paper_towel]
    zone_b_marker: 4                     # 선반 2번(로마 숫자 구역) 중 4번
    zone_b_pose: [1.110, 1.500, -1.5708]
    zone_b_undock: 0.60
    zone_b_items: [tomato, carrot, salad]
    pack_marker: 5                       # OMX 포장 구역
    pack_pose: [0.724, 0.243, 0.107]
    pack_undock: 0.35
    home_pose: [0.120, 0.000, 0.000]     # 주차 구역 (return_home: true 일 때 복귀)
