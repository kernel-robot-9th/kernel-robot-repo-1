# Couping 연동 설정 (오케스트레이터 · OMX packer). 두산 피킹·비전 설정은 couping/config/couping.yaml

/**/omx_packer:
  ros__parameters:
    # TODO: 박스 덮개 닫기 정책 학습 후 경로 교체. 그 전엔 기존 정책으로 흐름만 시험
    policy_path: ~/il_ws/src/lerobot/outputs/train/omx_act_jun_pumpkin/checkpoints/last/pretrained_model
    dataset_name: jun_pumpkin
    task: Pick up the pumpkin and put it in the box
    episode_time: 30
    hf_user: euchxn
    # OMX 팔로워 보드 (시리얼 고정 경로)
    port: /dev/serial/by-id/usb-ROBOTIS_OpenRB-150_1A6E643A50323952582E3120FF07262C-if00

/**/orchestrator:
  ros__parameters:
    enable_picker: true
    enable_pinky: true
    enable_packer: true
    return_home: true
    picker_timeout: 120.0       # 품목 하나당 (주문 품목 수만큼 곱함)
    nav_timeout: 120.0
    packer_timeout: 90.0        # episode_time + 카메라 워밍업 여유
    nav_action: /navigate_to_pose
    map_frame: map
    # 맵 좌표 [x(m), y(m), yaw(rad)]. 실측 도킹 및 주행 좌표
    home_pose: [0.0000, 0.0000, 0.0000]         # 핑키 초기 출발점 및 최종 주차장 (Home Parking)
    shelf_pick_spot1_pose: [0.5990, 1.4700, 3.1090]      # 선반 1번 피킹 도킹 진입 위치
    shelf_pick_spot2_pose: [1.0210, 1.5320, -1.5680]    # 선반 2번 피킹 도킹 진입 위치
    pack_pose: [0.7240, 0.2430, 0.1070]         # 포장구역(OMX 패키징) 앞 도킹 진입 위치
