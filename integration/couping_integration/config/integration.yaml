# Couping 연동 설정 (오케스트레이터 · OMX packer). 두산 피킹·비전 설정은 couping/config/couping.yaml

/**/omx_packer:
  ros__parameters:
    # 양팔 OMX (OMX 팀 omx/scripts/run_act.sh). 비운 값은 run_act.sh 기본값을 씀
    run_script: ~/team/kernel-robot-repo-1/omx/scripts/run_act.sh
    policy_path: ~/team/kernel-robot-repo-1/omx/models/act_120000/pretrained_model   # 릴리스 omx-act-120000 (git 에는 안 올라감)
    # 카메라는 /dev/videoN 대신 꽂힌 USB 자리 기준 경로 (다시 꽂아도 번호가 안 바뀜, 같은 자리에 꽂을 것)
    # 10/19 확인: 왼손목 = 허브A 3번, 오른손목 = 허브B 4번, 머리(SNAP U2) = 허브B 2번
    left_cam: /dev/v4l/by-path/pci-0000:80:14.0-usb-0:4.3:1.0-video-index0
    right_cam: /dev/v4l/by-path/pci-0000:80:14.0-usb-0:10.4:1.0-video-index0
    head_cam: /dev/v4l/by-path/pci-0000:80:14.0-usb-0:10.2:1.0-video-index0
    cam_fourcc: MJPG            # 손목 카메라(Innomaker)가 USB 2 허브에서 기본 형식으론 영상이 안 나옴
    task: Packaging the box     # 학습 때 문장과 같게
    episode_time: 60
    ports: [/dev/left_omx_follower, /dev/right_omx_follower]   # signal_only 때 확인
    fake_seconds: 5.0           # fake:=true 일 때 OMX 대신 기다리는 시간

/**/orchestrator:
  ros__parameters:
    enable_picker: true
    enable_pinky: true
    enable_packer: true
    return_home: false          # 포장 구역까지 간 뒤 home_pose(주차 구역)로 복귀할지
    picker_timeout: 240.0       # 품목 하나당 (주문 품목 수만큼 곱함). 카메라 확인 후 재시도(최대 3번, 한 번 약 65초) 포함
    nav_timeout: 120.0
    packer_timeout: 120.0       # episode_time(60) + 카메라·모델 로딩 여유
    pause_on_error: false       # false: 실패한 주문은 실패로 남기고 다음 주문을 바로 진행 (true: 멈추고 resume 대기)
    manual_transfer: false      # 핑키 없이: 피킹 뒤 사람이 박스를 OMX 로 옮기고 관리자 화면 '박스 옮김 완료'
    transfer_timeout: 600.0
    nav_action: /navigate_to_pose
    map_frame: map
    # 맵 좌표 [x(m), y(m), yaw(rad)]. TODO: RViz 의 2D Goal Pose 로 확인한 값으로 교체
    # 지도 좌표 [x(m), y(m), yaw(rad)]. integration/tools/pinky_waypoint.py --save <이름> 으로 RViz 에서 찍어 저장
    pick_pose: [0.0, 0.0, 0.0]     # 창고(두산 앞 도킹 구역): 두산이 상자에 담는 위치
    pack_pose: [0.0, 0.0, 0.0]     # OMX 포장 구역
    home_pose: [0.0, 0.0, 0.0]     # 주차 구역 (return_home: true 일 때 복귀)
