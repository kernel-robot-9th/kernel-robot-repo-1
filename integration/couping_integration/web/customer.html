<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Couping 주문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#2348C9;--ink:#15171C;--sub:#5B6170;--line:#E8EAEF;--bg:#F5F6F8}
*{box-sizing:border-box}
body{margin:0;background:#E9EBEF;font-family:'IBM Plex Sans KR',system-ui,sans-serif;color:var(--ink);font-size:14px;line-height:1.5}
.app{max-width:440px;min-height:100vh;margin:0 auto;background:var(--bg);position:relative;display:flex;flex-direction:column}
button{font:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{padding:22px 20px 16px;background:#fff}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.where{margin-top:14px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:12px;background:#F3F5FA;font-size:13px}
.sec{padding:18px 20px 8px;display:flex;align-items:baseline;justify-content:space-between}
h1{margin:0;font-size:18px}
.list{padding:0 20px 120px;display:flex;flex-direction:column;gap:10px}
.card{display:flex;align-items:center;gap:14px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.thumb{width:52px;height:58px;border-radius:12px;background:#F3F5F8;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;flex:none}
.cup{width:30px;height:36px;border-radius:4px 4px 7px 7px}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.name{font-weight:600;font-size:15px}
.muted{font-size:12px;color:var(--sub)}
.add{min-width:64px;height:44px;padding:0 14px;border:none;border-radius:12px;background:#EEF1F8;color:var(--accent);font-weight:700}
.add:disabled{color:#9AA0AD;cursor:not-allowed}
.step{display:flex;align-items:center;gap:6px;padding:4px;border-radius:12px;background:#F0F3FB}
.step button{width:36px;height:36px;border:none;border-radius:9px;background:#fff;font-size:18px}
.step button:hover,.add:hover:not(:disabled){background:#E4E8F3}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;padding:14px 20px 22px;background:linear-gradient(rgba(245,246,248,0),var(--bg) 30%)}
.cta{width:100%;min-height:56px;border:none;border-radius:16px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:16px;font-weight:700;color:#fff;background:var(--accent);box-shadow:0 8px 20px rgba(35,72,201,.25)}
.cta:disabled{background:#B9BFCC;box-shadow:none;cursor:not-allowed}
.cta:hover:not(:disabled){filter:brightness(.92)}
.badge{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:#fff;color:var(--accent);font-size:13px;display:inline-flex;align-items:center;justify-content:center}
.err{margin:0 20px;padding:10px 12px;border-radius:12px;background:#FDEEE4;color:#9A3412;font-size:13px}
.back{width:40px;height:40px;border:none;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.headline{margin:6px 0 4px;font-size:26px;line-height:1.3;font-weight:700;letter-spacing:-.02em}
.panel{margin:12px 20px 0;padding:16px;border-radius:18px;background:#fff;border:1px solid var(--line)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.steps li{display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.steps .ln{position:absolute;top:13px;right:50%;width:100%;height:2px;background:#E2E5EB}
.steps .dot{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#fff;border:2px solid #D5D9E1}
.steps .lb{font-size:11px;text-align:center;line-height:1.3;color:#8A90A0;font-weight:500}
.steps li.on .ln{background:var(--accent)}
.steps li.on .dot{background:var(--accent);border-color:var(--accent)}
.steps li.on .lb{color:var(--ink)}
.steps li.now .dot{box-shadow:0 0 0 6px rgba(35,72,201,.14)}
.steps li.now .lb{font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.sw{width:10px;height:10px;border-radius:50%;flex:none}
.pill{padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#EEF0F4;color:#3D4350}
.pill.ok{background:#E7F4EC;color:#17663F}.pill.run{background:#E8EDFB;color:#1A3698}.pill.warn{background:#FDEEE4;color:#9A3412}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="app">

<div id="shop">
<div class="top">
<div class="brand">
<div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg></div>
<div style="display:flex;flex-direction:column"><strong style="font-size:17px">Couping</strong><span class="muted">로봇 창고에서 바로 담아 보내요</span></div>
</div>
<div class="where"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#3D4350" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span class="muted">받는 곳</span><strong>포장대</strong></div>
</div>
<div class="sec"><h1>오늘의 상품</h1><span class="muted" id="stockNote">한 번에 최대 6개</span></div>
<p class="err" id="err" hidden></p>
<div class="list" id="list"></div>
<div class="bar"><button class="cta" id="orderBtn" disabled><span id="orderLabel">상품을 담아 주세요</span><span class="badge" id="badge" hidden>0</span></button></div>
</div>

<div id="track" hidden>
<div style="padding:20px 20px 0" class="row"><button class="back" id="backBtn" aria-label="상품 목록으로"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#15171C" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></button><strong>주문 <span id="tId"></span></strong></div>
<div style="padding:22px 20px 8px">
<div style="font-size:13px;font-weight:600;color:var(--accent)" id="tEta"></div>
<h1 class="headline" id="tHead"></h1>
<p style="margin:0;color:#4A5060" id="tSub"></p>
</div>
<div class="panel" style="padding:20px 16px 16px"><ol class="steps" id="steps"></ol></div>
<div class="panel row" style="gap:14px">
<div style="width:48px;height:48px;border-radius:14px;background:#EEF1F8;display:flex;align-items:center;justify-content:center;flex:none"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2348C9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="8" width="14" height="10" rx="3"/><path d="M12 8V5"/><circle cx="12" cy="4" r="1"/><circle cx="9.5" cy="13" r="1"/><circle cx="14.5" cy="13" r="1"/><path d="M3 12v2M21 12v2"/></svg></div>
<div style="display:flex;flex-direction:column;min-width:0"><span class="muted">지금 일하는 로봇</span><strong id="tRobot"></strong></div>
</div>
<div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:10px"><strong>주문 내역</strong><span class="muted" id="tCount"></span></div><div id="tLines" style="display:flex;flex-direction:column;gap:8px"></div></div>
<div style="padding:16px 20px 24px"><button class="cta" id="againBtn" hidden>다시 주문하기</button><p class="muted" id="liveNote" style="text-align:center;margin:0">상태가 바뀌면 이 화면이 자동으로 갱신돼요</p></div>
</div>

</div>
<script>
const COLORS = {tomato:'#D64545', carrot:'#E07B1F', salad:'#2F9455', bath_tissue:'#3E7BE6', tide:'#C99A17', paper_towel:'#8B5CD6'};
const STEPS = ['주문 확인','상품 담는 중','포장 시작','배송 시작','배송 완료'];
const COPY = [
  ['주문을 확인했어요','곧 로봇이 상품을 담기 시작해요','곧 시작해요','주문 접수 · 대기열'],
  ['상품을 담고 있어요','핑키가 창고로 와서 로봇팔이 상품을 상자에 담고 있어요','상품 준비 중','핑키와 두산 로봇팔이 상품을 담는 중'],
  ['포장을 시작했어요','핑키가 상자를 포장 구역으로 옮겨 뚜껑을 닫고 있어요','포장 중','핑키와 OMX 로봇팔이 포장하는 중'],
  ['배송을 시작했어요','핑키가 배송 구역으로 출발했어요','배송 중','핑키가 배송 중'],
  ['배송이 완료됐어요','주문해 주셔서 고마워요','도착 완료','모든 로봇이 다음 주문을 기다려요']
];
let S = null, cart = {}, myId = null;
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const total = () => Object.values(cart).reduce((a, b) => a + b, 0);

function renderShop() {
  if (!S) return;
  const hasStock = Object.keys(S.stock || {}).length > 0;
  $('stockNote').textContent = hasStock ? '재고는 진열대 카메라 기준' : '한 번에 최대 6개';
  $('list').innerHTML = S.catalog.map((c) => {
    const q = cart[c.key] || 0;
    const stock = hasStock ? (S.stock[c.key] || 0) : 9;
    const left = stock - q;
    const canAdd = total() < 6 && left > 0;
    const stockText = !hasStock ? '진열대 ' + c.no + '번 상품' : left > 0 ? `남은 재고 ${left}개` : (stock ? '재고를 다 담았어요' : '품절');
    const ctl = q ? `<div class="step"><button data-k="${c.key}" data-d="-1" aria-label="${esc(c.name)} 하나 빼기">−</button><strong style="min-width:16px;text-align:center">${q}</strong><button data-k="${c.key}" data-d="1" aria-label="${esc(c.name)} 하나 더" ${canAdd ? '' : 'disabled'}>+</button></div>`
                  : `<button class="add" data-k="${c.key}" data-d="1" ${canAdd ? '' : 'disabled'}>담기</button>`;
    return `<div class="card"><div class="thumb"><div class="cup" style="background:linear-gradient(${COLORS[c.key]} 0 22%,#DCDFE6 22% 100%)"></div></div>
      <div class="info"><span class="name">${esc(c.name)}</span><span class="muted">${esc(c.key)}</span><span class="muted" style="color:${left > 0 || !hasStock ? '' : '#9A3412'}">${stockText}</span></div>${ctl}</div>`;
  }).join('');
  const n = total();
  $('orderBtn').disabled = n === 0;
  $('orderLabel').textContent = n ? '주문하기' : '상품을 담아 주세요';
  $('badge').hidden = !n; $('badge').textContent = n;
}

function renderTrack() {
  const o = S && S.orders.find((x) => x.id === myId);
  if (!o) return;
  const failed = o.stage < 0;
  const stage = failed ? 0 : o.stage;
  const c = failed ? ['주문 처리에 문제가 생겼어요', '관리자가 확인하고 있어요. ' + (o.detail || ''), '확인 중', '관리자 확인 중'] : COPY[stage];
  $('tId').textContent = o.id; $('tEta').textContent = c[2]; $('tHead').textContent = c[0]; $('tSub').textContent = c[1]; $('tRobot').textContent = c[3];
  $('steps').innerHTML = STEPS.map((lb, i) => {
    const on = i <= stage, now = i === stage && stage < 4 && !failed;
    const done = i < stage || stage === 4;
    const icon = done ? '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>' : now ? '<span style="width:10px;height:10px;border-radius:50%;background:#fff"></span>' : '';
    return `<li class="${on ? 'on' : ''} ${now ? 'now' : ''}">${i ? '<div class="ln"></div>' : ''}<div class="dot">${icon}</div><span class="lb">${lb}</span></li>`;
  }).join('');
  $('tCount').textContent = o.lines.length + '개';
  $('tLines').innerHTML = o.lines.map((l) => {
    const tone = l.state === '상자에 넣음' ? 'ok' : l.state === '담는 중' ? 'run' : (l.state === '담지 못함' || l.state === '다시 담는 중') ? 'warn' : '';
    return `<div class="row"><span class="sw" style="background:${COLORS[l.item]}"></span><span style="flex:1">${esc(l.name)}</span><span class="pill ${tone}">${esc(l.state)}</span></div>`;
  }).join('');
  const end = stage === 4 || failed;
  $('againBtn').hidden = !end; $('liveNote').hidden = end;
}

function show(screen) {
  $('shop').hidden = screen !== 'shop'; $('track').hidden = screen !== 'track';
  window.scrollTo(0, 0);
}

$('list').addEventListener('click', (e) => {
  const b = e.target.closest('button[data-k]'); if (!b || b.disabled) return;
  const k = b.dataset.k, q = (cart[k] || 0) + Number(b.dataset.d);
  if (q <= 0) delete cart[k]; else cart[k] = q;
  renderShop();
});
$('orderBtn').addEventListener('click', async () => {
  const items = []; S.catalog.forEach((c) => { for (let i = 0; i < (cart[c.key] || 0); i++) items.push(c.key); });
  $('orderBtn').disabled = true; $('err').hidden = true;
  try {
    const r = await fetch('/api/order', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({items})});
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || '주문 실패');
    myId = d.id; cart = {}; localStorage.setItem('couping_order', myId);
    show('track'); renderTrack();
  } catch (err) {
    $('err').textContent = '주문하지 못했어요: ' + err.message; $('err').hidden = false; renderShop();
  }
});
$('backBtn').addEventListener('click', () => { show('shop'); renderShop(); });
$('againBtn').addEventListener('click', () => { myId = null; localStorage.removeItem('couping_order'); show('shop'); renderShop(); });

try { myId = localStorage.getItem('couping_order'); } catch (e) {}
const es = new EventSource('/events');
es.onmessage = (ev) => {
  S = JSON.parse(ev.data);
  if (myId && !S.orders.find((x) => x.id === myId)) myId = null;
  if (myId && $('track').hidden && $('shop').dataset.init !== '1') show('track');
  $('shop').dataset.init = '1';
  renderShop(); renderTrack();
};
es.onerror = () => { $('err').textContent = '서버와 연결이 끊겼어요. 다시 연결하는 중…'; $('err').hidden = false; };
es.onopen = () => { $('err').hidden = true; };
</script>
</body>
</html>
