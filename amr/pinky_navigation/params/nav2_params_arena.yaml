amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 40
    max_particles: 1000
    min_particles: 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.1   # 10/28: 위와 같음
    recovery_alpha_slow: 0.001   # 10/28: 위치를 잃으면 무작위 입자를 뿌려 다시 찾음 (0 이면 복구 안 됨)
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose:
      x: 0.12
      y: 0.0
      z: 0.0
      yaw: 0.0

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      stateful: true

      # 기본 주행 및 속도 (소형 아레나용)
      desired_linear_vel: 0.12   # 10/28: 0.18 -> 0.12 (좁은 통로에서 경로를 덜 벗어나게)
      allow_reversing: false   # 10/28: true -> false (앞뒤로 갈팡질팡 방지)
      max_angular_accel: 3.2

      # 경로 추종 (아레나 크기 1.5m x 2.25m에 맞게 튜닝)
      lookahead_dist: 0.22
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0
      min_lookahead_dist: 0.12
      max_lookahead_dist: 0.30
      curvature_lookahead_dist: 0.25
      use_fixed_curvature_lookahead: false

      # 제자리 회전 (헤딩 정렬)
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.6   # 10/28: 0.35 -> 0.6 rad (조금 틀어진 건 앞으로 가며 맞춤, 제자리 회전 줄임)
      rotate_to_heading_angular_vel: 0.7

      # 커브길 감속
      use_regulated_linear_velocity_scaling: true
      regulated_linear_scaling_min_radius: 0.20
      regulated_linear_scaling_min_speed: 0.04

      # 장애물 접근 시 감속 (Cost Regulated)
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.10   # 10/28: 0.20 -> 0.10 (벽 10cm 안에서만 감속)
      cost_scaling_gain: 1.0
      inflation_cost_scaling_factor: 3.0   # 10/28: 코스트맵 cost_scaling_factor(3.0) 와 맞춤

      # 목적지 접근 시 감속 및 정렬
      approach_velocity_scaling_dist: 0.30
      min_approach_linear_velocity: 0.04

      # 안전 및 충돌 방지: 소형 아레나에서 오발동으로 인한 멈춤(Lock) 방지 위해 false
      use_collision_detection: true   # 10/28: 다시 켬 - 꺼져 있어 벽에 계속 부딪히고, 부딪힐 때 바퀴가 미끄러져 위치 추정이 깨지던 문제
      max_allowed_time_to_collision_up_to_carrot: 0.5   # 10/28: 1.0 -> 0.5 (충돌 예측을 덜 앞서 함)
      max_robot_pose_search_dist: 1.0
      transform_tolerance: 0.2

      use_cancel_deceleration: false
      cancel_deceleration: 3.2
      interpolate_curvature_after_goal: false

    controller_plugins: ["FollowPath"]
    controller_frequency: 20.0   # 10/28: 10 -> 20Hz (경로 촘촘히 추종, 노트북 계산)
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    costmap_update_timeout: 0.5
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.5
    publish_zero_velocity: true
    speed_limit_topic: "speed_limit"
    odom_topic: "odom"
    use_realtime_priority: false
    use_sim_time: false
    start_type_description_service: true

    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5

    goal_checker_plugins: ["general_goal_checker"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.25

    progress_checker_plugins: ["progress_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      movement_time_allowance: 15.0   # 10/28: 25 -> 15s
      required_movement_radius: 0.03   # 10/28: 0.05 -> 0.03 m (느리게라도 움직이면 진행으로 봄)

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02   # 10/28: 0.025 -> 0.02 (맵 해상도와 같게. 0.025 면 벽이 한 칸 두꺼워져 7cm 여유 통로를 못 지나감)
      # Reflect 270x100mm rear cargo tray (T-shaped polygon footprint with 5mm margin)
      # Front body: width 150mm (y=±0.075m), Rear tray: width 280mm (y=±0.140m), Rear end: x=-0.28m
      footprint_padding: 0.0   # 10/28: 여유 없음
      footprint: '[[0.072, 0.0585], [0.072, -0.0585], [-0.063, -0.0585], [-0.063, -0.099], [-0.153, -0.099], [-0.153, 0.126], [-0.063, 0.126], [-0.063, 0.0585]]'   # 10/28: 실측 x 0.9, 비대칭 적재판 반영 (왼쪽 +y: 140mm*0.9=0.126, 오른쪽 -y: 110mm*0.9=0.099)
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan_filtered   # 10/28: 핑키 자기 몸(적재판) 점 지운 라이다 (integration/tools/scan_self_filter.py). 되돌리기: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.05
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0   # 10/28: 7.5 -> 3.0 (벽 비용이 천천히 줄어 통로 가운데가 가장 쌈)
        inflation_radius: 0.25   # 10/28: 0.20 -> 0.25 (통로 양쪽 벽 비용이 겹쳐 가운데로 다니게)
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.0   # 10/28: 여유 없음
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      # Reflect 270x100mm rear cargo tray (T-shaped polygon footprint with 5mm margin)
      footprint: '[[0.072, 0.0585], [0.072, -0.0585], [-0.063, -0.0585], [-0.063, -0.099], [-0.153, -0.099], [-0.153, 0.126], [-0.063, 0.126], [-0.063, 0.0585]]'   # 10/28: 실측 x 0.9, 비대칭 적재판 반영 (왼쪽 +y: 140mm*0.9=0.126, 오른쪽 -y: 110mm*0.9=0.099)
      resolution: 0.02   # 10/28: 0.025 -> 0.02 (맵 해상도와 같게. 0.025 면 벽이 한 칸 두꺼워져 7cm 여유 통로를 못 지나감)
      track_unknown_space: true
      plugins: ["static_layer", "inflation_layer"]   # 10/27: 라이다 장애물 층 뺌 - 위치·지연 오차로 잘못 찍힌 장애물이 경로 계획을 막던 문제. 실제 장애물은 로컬 코스트맵이 맡음
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.05
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0   # 10/28: 7.5 -> 3.0 (벽 비용이 천천히 줄어 통로 가운데가 가장 쌈)
        inflation_radius: 0.25   # 10/28: 0.20 -> 0.25 (통로 양쪽 벽 비용이 겹쳐 가운데로 다니게)
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.1
      use_astar: true
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.5]
    min_velocity: [-0.25, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
