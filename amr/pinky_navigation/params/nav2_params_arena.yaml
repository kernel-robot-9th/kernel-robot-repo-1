amcl:
  ros__parameters:
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 100.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    max_beams: 40
    max_particles: 1000
    min_particles: 200
    odom_frame_id: "odom"
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 1.0
    update_min_a: 0.1
    update_min_d: 0.15
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan
    set_initial_pose: true
    initial_pose: [0, 0, 0]

bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"

    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

controller_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true

    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      stateful: true

      # 기본 주행 및 속도 (소형 아레나용)
      desired_linear_vel: 0.18
      allow_reversing: true    # 10/26: 협소 공간 후진 기동 허용
      max_angular_accel: 3.2

      # 경로 추종 (아레나 크기 1.5m x 2.25m에 맞게 축소)
      lookahead_dist: 0.25
      use_velocity_scaled_lookahead_dist: true
      lookahead_time: 1.0
      min_lookahead_dist: 0.15
      max_lookahead_dist: 0.40
      curvature_lookahead_dist: 0.30
      use_fixed_curvature_lookahead: false

      # 제자리 회전
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.35
      rotate_to_heading_angular_vel: 0.8

      # 커브길 감속
      use_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.3
      regulated_linear_scaling_min_speed: 0.05

      # 장애물 접근 시 감속
      use_cost_regulated_linear_velocity_scaling: true
      cost_scaling_dist: 0.25
      cost_scaling_gain: 1.2
      inflation_cost_scaling_factor: 10.0  # 10/26: 코스트맵 cost_scaling_factor(10.0) 와 맞춤

      # 목적지 접근 시 감속
      approach_velocity_scaling_dist: 0.25
      min_approach_linear_velocity: 0.05

      # 안전 및 충돌 방지
      use_collision_detection: false   # 10/26: 협소 공간에서 충돌 오인으로 속도 0 데드락 방지
      max_allowed_time_to_collision_up_to_carrot: 0.5
      max_robot_pose_search_dist: 1.0
      transform_tolerance: 1.0   # 10/23: Wi-Fi 로 라이다가 늦게 와 map->odom 이 0.5~0.9s 늦어 주행 중 중단 → 0.2 에서 늘림

      use_cancel_deceleration: false
      cancel_deceleration: 3.2
      interpolate_curvature_after_goal: false

    controller_plugins: ["FollowPath"]
    controller_frequency: 20.0
    action_server_result_timeout: 10.0
    autostart_node: false
    bond_heartbeat_period: 0.1
    costmap_update_timeout: 0.3
    enable_stamped_cmd_vel: false
    failure_tolerance: 0.3
    publish_zero_velocity: true
    speed_limit_topic: "speed_limit"
    odom_topic: "odom"
    use_realtime_priority: false
    use_sim_time: false
    start_type_description_service: true

    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5

    goal_checker_plugins: ["general_goal_checker"]

    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.06
      yaw_goal_tolerance: 0.15

    progress_checker_plugins: ["progress_checker"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      movement_time_allowance: 25.0    # 10/26: 10.0 -> 25.0 (Failed to make progress 방지)
      required_movement_radius: 0.05   # 10/26: 0.15 -> 0.05

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      transform_tolerance: 1.0   # 10/23: 기본 0.3s. Wi-Fi 지연으로 map->odom 이 늦어 "Failed to transform end pose" 로 중단되던 문제
      robot_base_frame: base_footprint
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.02   # 10/26: 0.025 -> 0.02 (맵 해상도와 같게, 좁은 통로 정밀도)
      # 10/26: 후방 적재판(Cargo Plate) 포함. 적재판이 없으면 '[[0.065, 0.065], [0.065, -0.065], [-0.065, -0.065], [-0.065, 0.065]]'
      footprint: '[[0.08, 0.075], [-0.09, 0.075], [-0.09, 0.135], [-0.19, 0.135], [-0.19, -0.135], [-0.09, -0.135], [-0.09, -0.075], [0.08, -0.075]]'   # 10/27: 몸체(폭 15cm, 앞 8cm ~ 뒤 9cm) 뒤에 적재판 270x100mm (폭 27cm, x -0.09 ~ -0.19)
      plugins: ["obstacle_layer", "inflation_layer"]   # 10/26: voxel_layer 대신 2D 경량 obstacle_layer
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 10/26: 폭 40cm 통로 통과용. 통로 가운데(벽에서 0.20m)가 비용 0 이 되도록 반경 0.15m,
        # 대신 벽 가까이에서 비용이 빨리 줄도록 scaling 10 (이전 0.20m/3.0 은 통로 전체가 고비용)
        cost_scaling_factor: 10.0
        inflation_radius: 0.15   # 10/27: 적재판 270x100 반영 뒤 0.15 로 되돌림 (몸체 옆면 0.075m, 40cm 통로 튜닝값)
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08   # 10/26: 로봇 본체 프레임 반사파 제거
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.0   # 10/26: 0.01 -> 0 (좁은 통로에서 풋프린트 여유 1cm 도 아낌)
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      transform_tolerance: 1.0   # 10/23: 기본 0.3s. Wi-Fi 지연으로 map->odom 이 늦어 "Failed to transform end pose" 로 중단되던 문제
      robot_base_frame: base_footprint
      # 10/26: 후방 적재판(Cargo Plate) 포함. 적재판이 없으면 '[[0.065, 0.065], [0.065, -0.065], [-0.065, -0.065], [-0.065, 0.065]]'
      footprint: '[[0.08, 0.075], [-0.09, 0.075], [-0.09, 0.135], [-0.19, 0.135], [-0.19, -0.135], [-0.09, -0.135], [-0.09, -0.075], [0.08, -0.075]]'   # 10/27: 몸체(폭 15cm, 앞 8cm ~ 뒤 9cm) 뒤에 적재판 270x100mm (폭 27cm, x -0.09 ~ -0.19)
      resolution: 0.02   # 10/26: 0.025 -> 0.02 (맵 해상도와 같게, 좁은 통로 정밀도)
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.08   # 10/26: 로봇 본체 프레임 반사파 제거
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # 10/26: 폭 40cm 통로 통과용. 통로 가운데(벽에서 0.20m)가 비용 0 이 되도록 반경 0.15m,
        # 대신 벽 가까이에서 비용이 빨리 줄도록 scaling 10 (이전 0.20m/3.0 은 통로 전체가 고비용)
        cost_scaling_factor: 10.0
        inflation_radius: 0.15   # 10/27: 적재판 270x100 반영 뒤 0.15 로 되돌림 (몸체 옆면 0.075m, 40cm 통로 튜닝값)
      always_send_full_costmap: True

map_saver:
  ros__parameters:
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.2
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    assisted_teleop:
      plugin: "nav2_behaviors::AssistedTeleop"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 1.0   # 10/23: 0.1 -> 1.0 (도착 뒤 제자리 회전 등 behavior 도 같은 지연 영향)
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
    enable_stamped_cmd_vel: false

waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    scale_velocities: False
    feedback: "OPEN_LOOP"
    max_velocity: [0.25, 0.0, 1.5]
    min_velocity: [-0.25, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: "odom"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
    enable_stamped_cmd_vel: false
