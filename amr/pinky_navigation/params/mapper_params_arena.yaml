# ==============================================================================
# Pinky Pro Miniature Arena (1.5m x 1.8m) SLAM Parameters
# Optimized for small-scale testbed with narrow passages and thin walls.
# Original/Default parameters from mapper_params.yaml are noted in comments.
# ==============================================================================

slam_toolbox:
  ros__parameters:

    # Plugin params
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # ROS Parameters
    odom_frame: odom
    map_frame: map
    base_frame: base_footprint
    scan_topic: /scan
    mode: mapping #localization

    debug_logging: false
    throttle_scans: 1
    transform_publish_period: 0.02 #if 0 never publishes odometry
    map_update_interval: 2.0       # [Default: 5.0] Faster 2s UI refresh for live teleop mapping
    resolution: 0.02              # [Default: 0.05] 2cm high resolution for thin walls & narrow gaps
    max_laser_range: 2.8           # [Default: 10.0] Covers diagonal (~2.58m) while ignoring outside arena
    minimum_time_interval: 0.5
    transform_timeout: 0.4
    tf_buffer_duration: 30.
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # General Parameters
    use_scan_matching: true
    use_scan_barycenter: true
    minimum_travel_distance: 0.08  # [Default: 0.5] Add keyframe every 8cm (prevents map drift in 1.5m arena)
    minimum_travel_heading: 0.15   # [Default: 0.5] Add keyframe every ~8.6 deg
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 2.8 # [Default: 8.0]
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 2.5     # [Default: 3.0] Confined loop search for 2.1m arena
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # Correlation Parameters - Correlation Parameters
    correlation_search_space_dimension: 0.3  # [Default: 0.5] Narrow search space prevents cross-wall false matching
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # Correlation Parameters - Loop Closure Parameters
    loop_search_space_dimension: 3.0        # [Default: 8.0] Matched to 2.1m arena size
    loop_search_space_resolution: 0.02      # [Default: 0.05]
    loop_search_space_smear_deviation: 0.03

    # Scan Matcher Parameters
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0

    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
